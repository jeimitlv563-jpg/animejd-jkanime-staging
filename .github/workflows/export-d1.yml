name: Exportar respaldo JKAnime para D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar respaldo JSONL
        run: npm run export:d1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Guardar respaldo temporal
        uses: actions/upload-artifact@v4
        with:
          name: jkanime-d1-export
          path: export/
          retention-days: 7
          compression-level: 9
